name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "20 4 * * *" # daily full-history audit (bot commits do not trigger push events)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # the audit reads the whole history of forecasts/
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (offline, fixture data only)
        run: uv run pytest
      - name: Audit the book (no forecast file ever modified or deleted)
        run: uv run prognosebuch audit
      - name: Open issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/failure-issue
        with:
          title: "Scheduled audit failed"
          token: ${{ github.token }}
