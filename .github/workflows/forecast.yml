name: forecast

# Target issue time is about 09:00 Europe/Berlin, well before the auction gate closure
# (12:00) and the publication of results (~12:45). The clock workflow dispatches this job
# at 08:55, 09:30 and 10:30 Berlin time; the cron entries below are a backup (GitHub's
# scheduler proved unreliable here). The script itself checks local time, issues only in
# [08:45, 12:00) and exits without changes if today's forecasts already exist.
#   06:50 UTC = 08:50 CEST (summer)  | 07:50 CET (winter, too early -> skip)
#   07:50 UTC = 09:50 CEST (fallback) | 08:50 CET (winter)
#   09:20 UTC and 09:40 UTC           = late fallbacks in both seasons
on:
  schedule:
    - cron: "50 6 * * *"
    - cron: "50 7 * * *"
    - cron: "20 9 * * *"
    - cron: "40 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev
      - name: Issue forecasts
        id: fc
        continue-on-error: true
        run: uv run --no-dev prognosebuch forecast
      - name: Commit new forecast files (additions only)
        if: always()
        run: |
          scripts/commit-data.sh "forecast: issue $(TZ=Europe/Berlin date +%F)" forecasts
      - name: Audit
        run: uv run --no-dev prognosebuch audit
      - name: Fail if a forecast could not be issued
        if: steps.fc.outcome == 'failure'
        run: exit 1
      - name: Open issue on failure
        if: failure()
        uses: ./.github/actions/failure-issue
        with:
          title: "Forecast job failed"
          token: ${{ github.token }}
      - name: Close failure issue after a successful run
        if: success()
        uses: ./.github/actions/failure-issue
        with:
          title: "Forecast job failed"
          token: ${{ github.token }}
          resolve: "true"
