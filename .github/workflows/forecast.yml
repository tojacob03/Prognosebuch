name: forecast

# Target issue time is about 09:00 Europe/Berlin, well before the auction gate closure
# (12:00) and the publication of results (~12:45). Cron runs in UTC and can be delayed,
# so there are several triggers; the script itself checks local time, issues only in
# [08:45, 12:00) and exits without changes if today's forecasts already exist.
#   06:50 UTC = 08:50 CEST (summer)  | 07:50 CET (winter, too early -> skip)
#   07:50 UTC = 09:50 CEST (fallback) | 08:50 CET (winter)
#   09:20 UTC and 09:40 UTC           = late fallbacks in both seasons
on:
  schedule:
    - cron: "50 6 * * *"
    - cron: "50 7 * * *"
    - cron: "20 9 * * *"
    - cron: "40 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev
      - name: Issue forecasts
        id: fc
        continue-on-error: true
        run: uv run --no-dev prognosebuch forecast
      - name: Commit new forecast files (additions only)
        if: always()
        run: |
          git config user.name "prognosebuch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          if git diff --cached --no-renames --name-status --diff-filter=MDT | grep .; then
            echo "::error::refusing to commit a change to an existing forecast"; exit 1
          fi
          git commit -q -m "forecast: issue $(TZ=Europe/Berlin date +%F)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          exit 1
      - name: Audit
        run: uv run --no-dev prognosebuch audit
      - name: Fail if a forecast could not be issued
        if: steps.fc.outcome == 'failure'
        run: exit 1
      - name: Open issue on failure
        if: failure()
        uses: ./.github/actions/failure-issue
        with:
          title: "Forecast job failed"
          token: ${{ github.token }}
