name: probe

# Logs hourly how far each SMARD series reaches, to measure when grid-operator
# forecasts for D+1 become available. Written to the separate `probe` branch so the
# main history stays readable.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: probe
          path: probe-data
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev
      - run: uv run --no-dev prognosebuch probe --out probe-data/smard_availability.csv
      - name: Commit
        working-directory: probe-data
        run: |
          git config user.name "prognosebuch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smard_availability.csv
          git commit -q -m "probe: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
