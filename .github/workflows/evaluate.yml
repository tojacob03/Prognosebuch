name: evaluate

# Day-ahead results for D+1 appear around 12:45 Europe/Berlin (10:45 UTC summer,
# 11:45 UTC winter); SMARD can lag. The clock workflow dispatches this job at 14:50,
# 17:40 and 21:10 Berlin time; the cron entries are a backup. Scored days are skipped.
on:
  schedule:
    - cron: "40 12 * * *"
    - cron: "40 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev
      - name: Update actuals, score due days, update summary
        run: uv run --no-dev prognosebuch evaluate
      - name: Commit
        run: |
          scripts/commit-data.sh "evaluate: $(TZ=Europe/Berlin date +%F)" actuals scores inputs
      - name: Audit
        run: uv run --no-dev prognosebuch audit
      - name: Open issue on failure
        if: failure()
        uses: ./.github/actions/failure-issue
        with:
          title: "Evaluate job failed"
          token: ${{ github.token }}
      - name: Close failure issue after a successful run
        if: success()
        uses: ./.github/actions/failure-issue
        with:
          title: "Evaluate job failed"
          token: ${{ github.token }}
          resolve: "true"
