name: Failure issue
description: Open a GitHub issue for a failed scheduled job, or comment on the open one.
inputs:
  title:
    description: Issue title (one open issue per title)
    required: true
  token:
    description: Token with issues:write
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TITLE: ${{ inputs.title }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
          --json number,title --jq '.[] | select(.title == $ENV.TITLE) | .number' | head -1)
        body="Failed run at $(date -u +%Y-%m-%dT%H:%M:%SZ): $RUN_URL"
        if [ -n "$num" ]; then
          gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
        else
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
        fi
