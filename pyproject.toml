[project]
name = "prognosebuch"
version = "0.1.0"
description = "Day-ahead electricity price forecasts for DE-LU with a public, pre-registered, automatically scored track record."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [{ name = "tojacob03" }]
dependencies = [
    "holidays>=0.60",
    "httpx>=0.27",
    "jinja2>=3.1",
    "markdown-it-py>=3",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]

[project.scripts]
prognosebuch = "prognosebuch.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
    "scipy-stubs>=1.14",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prognosebuch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "PD", "NPY", "RUF"]
ignore = ["PD010"]

[tool.ruff.lint.per-file-ignores]
# Site texts use typographic characters on purpose (en dash, minus sign, thin spaces).
"src/prognosebuch/site/*.py" = ["RUF001"]
"src/prognosebuch/site/exports.py" = ["RUF001", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = false
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "sklearn.*", "joblib.*"]
ignore_missing_imports = true

# pandas-stubs rejects .loc with datetime.date labels, which the tests use on purpose.
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["index"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
